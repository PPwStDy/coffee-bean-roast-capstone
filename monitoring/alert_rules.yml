groups:
  - name: coffee_roast_alerts
    rules:
      - alert: CameraSensorOcclusionWarning
        expr: rate(coffee_anomaly_frames_total{rejection_reason="low_variance_occlusion"}[1m]) > 0
        for: 10s
        labels:
          severity: warning
          tier: hardware_telemetry
        annotations:
          summary: "Camera sensor optical occlusion or specular glare detected"
          description: "Inspection camera is reporting collapsed dynamic range or low entropy. Check lens for chaff buildup or glare."
