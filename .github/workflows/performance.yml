name: Performance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Warm requests from the release runner environment
        env:
          ENDPOINT_URL: ${{ vars.ENDPOINT_URL }}
        run: |
          if test -f monitoring/slo.json; then
            uv run --frozen python -m loadtest.bench --url "$ENDPOINT_URL" --enforce
          else
            uv run --frozen python -m loadtest.bench --url "$ENDPOINT_URL"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: reports/evidence/deployed-warm.json
