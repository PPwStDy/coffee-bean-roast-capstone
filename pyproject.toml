[project]
name = "coffee-bean-roast-capstone"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.0.0",
  "pillow>=10.0.0",
  "numpy==1.26.4",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "pandas==2.2.3",
  "prometheus-client>=0.19.0",
  "mlflow==3.17.0",
  "onnx==1.23.2",
  "onnxruntime==1.31.0",
  "dvc[azure]==3.67.1",
  "azure-identity==1.25.1",
  "azure-storage-blob==12.27.1",
  "python-multipart==0.0.22",
  "python-dotenv==1.2.1",
  "pytest>=7.4.0",
  "httpx>=0.25.0",
  "ruff>=0.3.0"
]

[tool.ruff]
line-length = 110
exclude = ["provenance", "reports/presentation", ".venv-legacy", "tmp", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
